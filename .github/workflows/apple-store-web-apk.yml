name: Build Apple Store Web Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'AppleAppStoreAndroid/**'
      - '.github/workflows/apple-store-web-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppleAppStoreAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AppleStoreWeb-Android-APK
          path: AppleAppStoreAndroid/app/build/outputs/apk/debug/*.apk
